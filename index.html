<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<title>Autorização</title>
<style>
  :root { --fundo: #0f1218; --texto: #eef1f5; --suave: #9aa3b2; --destaque: #ffc83d; --caixa: #1b2029; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--fundo);
         color: var(--texto); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 560px; padding: 24px 16px; }
  h1 { font-size: 22px; margin: 0 0 8px; }
  p { color: var(--suave); margin: 0 0 16px; }
  code { display: block; padding: 14px; background: var(--caixa); border-radius: 8px; word-break: break-all;
         font-size: 15px; color: var(--texto); margin-bottom: 12px; }
  button { background: var(--destaque); color: #111; border: 0; border-radius: 8px; padding: 10px 18px;
           font-weight: 700; font-size: 15px; cursor: pointer; }
  [hidden] { display: none; }
</style>
</head>
<body>
<main>
  <section id="com-codigo" hidden>
    <h1>Autorização concluída</h1>
    <p>Copie o código abaixo e cole no terminal onde o script de autorização está esperando. Ele vale poucos minutos e só pode ser usado uma vez.</p>
    <code id="codigo"></code>
    <button id="copiar" type="button">Copiar código</button>
  </section>
  <section id="sem-codigo">
    <h1>Canal de reviews</h1>
    <p>Página de retorno da autorização da ferramenta interna do canal. Não há nada para fazer aqui.</p>
  </section>
</main>
<script>
  const parametros = new URLSearchParams(location.search);
  const codigo = parametros.get("code");
  if (codigo) {
    document.getElementById("codigo").textContent = codigo;
    document.getElementById("com-codigo").hidden = false;
    document.getElementById("sem-codigo").hidden = true;
    document.getElementById("copiar").addEventListener("click", async (e) => {
      try { await navigator.clipboard.writeText(codigo); e.target.textContent = "Copiado"; }
      catch { e.target.textContent = "Selecione e copie à mão"; }
    });
    // tira o código da barra de endereço e do histórico do navegador
    history.replaceState(null, "", location.pathname);
  }
</script>
</body>
</html>
